<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 28 - Game kiểm tra tốc độ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2ff; text-align: center; color: #1e293b; }
    h1 { margin: 24px 0 12px; }
    .info { display: flex; justify-content: center; gap: 30px; margin: 16px; font-size: 20px; font-weight: bold; }
    #arena { position: relative; width: 600px; height: 400px; max-width: calc(100vw - 24px); margin: 0 auto; background: #fff; border: 3px solid #6366f1; border-radius: 12px; overflow: hidden; }
    #target { position: absolute; width: 45px; height: 45px; background: #ef4444; border-radius: 50%; cursor: pointer; display: none; box-shadow: 0 0 0 5px #fecaca; }
    #startBtn { margin: 18px 0; padding: 12px 24px; background: #4f46e5; border: 0; border-radius: 8px; color: white; font-size: 17px; cursor: pointer; }
    #startBtn:disabled { background: #94a3b8; cursor: not-allowed; }
    #message { font-size: 18px; font-weight: bold; min-height: 26px; }
  </style>
</head>
<body>
  <h1>GAME KIỂM TRA TỐC ĐỘ CLICK</h1>
  <div class="info">
    <span>Điểm: <span id="score">0</span></span>
    <span>Thời gian: <span id="time">30</span>s</span>
  </div>
  <div id="arena">
    <div id="target"></div>
  </div>
  <button id="startBtn">Bắt đầu trò chơi</button>
  <p id="message">Bấm nút để bắt đầu!</p>

  <script>
    const arena = document.getElementById('arena');
    const target = document.getElementById('target');
    const scoreText = document.getElementById('score');
    const timeText = document.getElementById('time');
    const startBtn = document.getElementById('startBtn');
    const message = document.getElementById('message');

    let score = 0;
    let timeLeft = 30;
    let gameRunning = false;
    let timer;
    let spawnTimer;

    function moveTarget() {
      if (!gameRunning) return;
      const maxX = arena.clientWidth - arena.clientLeft * 2 - target.offsetWidth;
      const maxY = arena.clientHeight - arena.clientTop * 2 - target.offsetHeight;
      target.style.left = Math.floor(Math.random() * (maxX + 1)) + 'px';
      target.style.top = Math.floor(Math.random() * (maxY + 1)) + 'px';
      target.style.display = 'block';
    }

    function finishGame() {
      gameRunning = false;
      clearInterval(timer);
      clearInterval(spawnTimer);
      target.style.display = 'none';
      startBtn.disabled = false;
      startBtn.textContent = 'Chơi lại';
      message.textContent = 'Hết giờ! Tổng điểm của bạn: ' + score;
    }

    function startGame() {
      clearInterval(timer);
      clearInterval(spawnTimer);
      score = 0;
      timeLeft = 30;
      gameRunning = true;
      scoreText.textContent = score;
      timeText.textContent = timeLeft;
      message.textContent = 'Click thật nhanh vào hình tròn đỏ!';
      startBtn.disabled = true;
      moveTarget();

      spawnTimer = setInterval(moveTarget, 1000);
      timer = setInterval(function () {
        timeLeft--;
        timeText.textContent = timeLeft;
        if (timeLeft <= 0) finishGame();
      }, 1000);
    }

    target.addEventListener('click', function (event) {
      event.stopPropagation();
      if (!gameRunning) return;
      score++;
      scoreText.textContent = score;
      moveTarget();
    });
    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
